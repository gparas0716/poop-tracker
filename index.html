<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Log</title>
<meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1917" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby Log">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f6f1ea; --card: #fffdfa; --ink: #2b2622; --muted: #7d736a; --line: #e6ddd2;
  --poop: #8a5a33; --pee: #c99a12; --feed: #3f7f8c; --accent: #3f7f8c; --danger: #b3402f;
  --warn-bg: #fdecd8; --warn-ink: #7a3d0c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1917; --card: #262320; --ink: #f1ebe4; --muted: #a2978c; --line: #3a3531;
    --poop: #c99468; --pee: #e3bd4a; --feed: #7fbfcc; --accent: #7fbfcc; --danger: #e57a68;
    --warn-bg: #4a3118; --warn-ink: #ffd9ad;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
header { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 8px; }
h1 { font-size: 22px; margin: 0; }
.status { font-size: 12px; color: var(--muted); }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }

.cards { display: grid; gap: 12px; margin-top: 8px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
}
.card h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); }
.card .count { font-size: 34px; font-weight: 700; line-height: 1.1; }
.card .count small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.card .sub { font-size: 14px; color: var(--muted); grid-column: 1; }
.card .next { grid-column: 1; font-size: 15px; font-weight: 600; margin-top: 4px; }
.card .next span { font-weight: 400; color: var(--muted); }
.card .next.due { color: var(--danger); }
.card .next.due span { color: inherit; }
.card .sides { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 10px; }
.card .sides button {
  flex: 1; border: 2px solid var(--feed); background: none; color: var(--ink); border-radius: 12px;
  padding: 13px 4px; font-weight: 700; font-size: 14px;
}
.card .sides button:disabled { opacity: 1; }
.card .sub .what { color: var(--ink); margin-top: 2px; }
.ev { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; display: grid; gap: 8px; }
.ev-head { display: flex; justify-content: space-between; align-items: center; }
.ev-head button { background: none; border: 0; color: var(--danger); font-size: 14px; padding: 4px; }
.ev-bottle { display: grid; grid-template-columns: 1fr 84px 76px; gap: 8px; }
.amt { display: grid; grid-template-columns: 1fr 150px; gap: 8px; align-items: stretch; }
.amt .seg label { min-width: 0; }
.amt .seg span { padding: 10px 4px; }
.evadd { display: flex; gap: 8px; }
.evadd button { flex: 1; border: 1px dashed var(--muted); background: none; border-radius: 12px; padding: 11px 4px; font-weight: 600; }
.card .sides button.done { border-color: var(--line); color: var(--muted); font-weight: 600; }
.card .add {
  grid-column: 2; grid-row: 1 / span 3; border: 0; border-radius: 14px; color: #fff;
  font-weight: 700; font-size: 16px; padding: 18px 16px; min-width: 104px;
}
.card.poop .add { background: var(--poop); } .card.poop .count { color: var(--poop); }
.card.pee .add { background: var(--pee); }  .card.pee .count { color: var(--pee); }
.card.feed .add { background: var(--feed); } .card.feed .count { color: var(--feed); }
@media (prefers-color-scheme: dark) { .card .add { color: #1b1917; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(128,128,128,.9); display: inline-block; flex: none; }

.tabs { display: flex; gap: 6px; margin: 22px 0 6px; }
.tabs button { flex: 1; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 0; font-size: 14px; }
.tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.day { margin-top: 16px; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); padding: 0 2px 6px; }
.day-head b { color: var(--ink); font-size: 15px; }
.row {
  display: grid; grid-template-columns: 78px 1fr; gap: 10px; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px;
}
.row .time { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; padding-top: 1px; }
.row .what { font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .note { font-size: 14px; color: var(--muted); margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.dur { font-size: 14px; color: var(--ink); margin-top: 2px; font-weight: 400; }
.card.feed .add.stop { background: var(--ink); color: var(--bg); }
.card .maincol { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 112px; }
.card .maincol .add { padding: 14px 10px; }
.card .add b { display: block; font-size: 26px; white-space: nowrap; line-height: 1.1; font-variant-numeric: tabular-nums; }
.card .add small { display: block; font-size: 13px; font-weight: 600; }
.card.feed .add.late { background: var(--danger); }
.readout { text-align: center; line-height: 1.2; }
.readout small { display: block; font-size: 13px; color: var(--muted); }
.readout b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; }
.pausebtn { border: 2px solid var(--feed); background: none; border-radius: 12px; padding: 12px 6px; font-weight: 700; font-size: 15px; }
.pausebtn.on { background: var(--feed); color: var(--bg); }
.card .prompt { grid-column: 1 / -1; margin-top: 12px; font-weight: 600; }
.card .link { grid-column: 1 / -1; justify-self: start; background: none; border: 0; padding: 10px 0 0; color: var(--accent); font-size: 14px; text-decoration: underline; }
.row .by { font-weight: 400; font-size: 12px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }

dialog {
  border: 0; padding: 0; background: var(--card); color: var(--ink); width: 100%; max-width: 560px;
  margin: auto auto 0; border-radius: 20px 20px 0 0; max-height: 92vh;
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog form { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 14px; }
dialog h3 { margin: 0; font-size: 19px; }
label.f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=url], input[type=number], input[type=datetime-local], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px;
}
textarea { min-height: 70px; resize: vertical; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg label { flex: 1; min-width: 88px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  border: 2px solid var(--line); border-radius: 12px; padding: 12px 8px; font-size: 15px; font-weight: 600; color: var(--ink);
}
.seg input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
.check input { width: 24px; height: 24px; accent-color: var(--accent); }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
.actions { display: flex; gap: 8px; }
.actions button { flex: 1; border-radius: 12px; padding: 14px; font-weight: 700; border: 1px solid var(--line); background: none; }
.actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; flex: 2; }
@media (prefers-color-scheme: dark) { .actions .primary { color: #1b1917; } }
.actions .del { color: var(--danger); flex: 0 0 auto; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Baby Log</h1>
    <div class="status" id="status"></div>
  </div>
  <button class="icon-btn" id="openSettings" aria-label="Settings">⚙︎ Settings</button>
</header>

<section class="cards" id="cards"></section>

<nav class="tabs" id="tabs">
  <button data-f="all" class="on">All</button>
  <button data-f="poop">Poop</button>
  <button data-f="pee">Pee</button>
  <button data-f="feed">Feed</button>
</nav>
<section id="history"></section>

<dialog id="entryDlg">
  <form id="entryForm" method="dialog">
    <h3 id="entryTitle"></h3>
    <label class="f" id="timeWrap">Day and time
      <input type="datetime-local" name="time" required>
    </label>

    <div id="poopFields">
      <label class="f">Color</label>
      <div class="seg" id="colorSeg"></div>
      <div class="warn" id="colorWarn" hidden>Red, black (after the first few days) or white/pale poop is worth a call to your pediatrician.</div>
    </div>

    <div id="feedFields">
      <label class="f">What happened in this feed</label>
      <div id="evList"></div>
      <div class="evadd">
        <button type="button" data-evadd="left">+ Left</button>
        <button type="button" data-evadd="right">+ Right</button>
        <button type="button" data-evadd="bottle">+ Bottle</button>
      </div>
      <label class="f" style="margin-top:14px">Feed ended (needed to work out the minutes)
        <input type="datetime-local" name="end">
      </label>
    </div>

    <label class="f">Notes
      <textarea name="note" placeholder="Optional"></textarea>
    </label>
    <div class="actions">
      <button type="button" class="del" id="delBtn" hidden>Delete</button>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="bottleDlg">
  <form id="bottleForm" method="dialog">
    <h3>Bottle</h3>
    <div class="seg">
      <label><input type="radio" name="b" value="formula"><span>Formula</span></label>
      <label><input type="radio" name="b" value="milk"><span>Breast milk</span></label>
    </div>
    <label class="f" for="bottleAmt">How much?</label>
    <div class="amt">
      <input type="number" name="amt" id="bottleAmt" inputmode="decimal" min="0" step="any">
      <div class="seg">
        <label><input type="radio" name="unit" value="oz"><span>oz</span></label>
        <label><input type="radio" name="unit" value="ml"><span>ml</span></label>
      </div>
    </div>
    <p class="hint" id="bottleHint"></p>
    <div class="actions">
      <button type="button" id="bottleCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="settingsDlg">
  <form id="settingsForm" method="dialog">
    <h3>Settings</h3>
    <label class="f">Your name (shown on each entry)
      <input type="text" name="name" placeholder="Mom, Dad…" maxlength="20">
    </label>
    <label class="f">Show bottle amounts in
      <select name="unit"><option value="oz">Ounces (oz)</option><option value="ml">Milliliters (ml)</option></select>
    </label>
    <label class="f">Hours between feeds (counted from the start of the last feed)
      <input type="number" name="feedHours" inputmode="decimal" min="0.5" max="12" step="0.25">
    </label>
    <label class="f">Sync database URL (Firebase Realtime Database)
      <input type="url" name="db" placeholder="https://your-project-default-rtdb.firebaseio.com" autocapitalize="off" autocorrect="off">
    </label>
    <p class="hint" id="syncHint"></p>
    <div class="actions">
      <button type="button" id="inviteBtn" hidden>Copy invite link</button>
      <button type="button" id="settingsCancel">Close</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
const COLORS = [
  { id: 'yellow', label: 'Yellow', hex: '#e0b32b' },
  { id: 'green',  label: 'Green',  hex: '#5b8c3a' },
  { id: 'brown',  label: 'Brown',  hex: '#7a4e2b' },
  { id: 'black',  label: 'Black',  hex: '#1d1b1a', warn: true },
  { id: 'red',    label: 'Red',    hex: '#c0392b', warn: true },
  { id: 'white',  label: 'White / pale', hex: '#ece7db', warn: true },
];
const COLOR = Object.fromEntries(COLORS.map(c => [c.id, c]));
const TYPES = { poop: 'Poop', pee: 'Pee', feed: 'Feed' };
const DAY = 24 * 60 * 60 * 1000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- storage ---------- */
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let entries = load('bt.entries', {});   // id -> entry (deleted ones kept as tombstones so deletes sync)
let dirty = new Set(load('bt.dirty', [])); // ids not yet pushed
let cfg = load('bt.cfg', { name: '', db: '', code: '' });
// settings both phones must agree on; synced like entries, newest change wins
let shared = load('bt.shared', { feedHours: 3, updated: 0 });
let sharedDirty = load('bt.sharedDirty', false);
const feedHours = () => (shared.feedHours >= 0.5 && shared.feedHours <= 12 ? shared.feedHours : 3);
let filter = 'all';
let starting = false; // "New feed" was tapped and we are waiting for the first step
let syncState = 'idle';
const persist = () => { save('bt.entries', entries); save('bt.dirty', [...dirty]); };

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const toLocalInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtTime = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dayKey = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
function fmtDay(ms) {
  const k = dayKey(ms), now = Date.now();
  if (k === dayKey(now)) return 'Today';
  if (k === dayKey(now - DAY)) return 'Yesterday';
  return new Date(ms).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
function span(ms) { // "1h 5m" for a positive duration
  const m = Math.max(0, Math.round(ms / 60000));
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 0) return 'in the future';
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 48) return `${h}h ${m % 60}m ago`;
  return `${Math.floor(h / 24)}d ago`;
}
const cap = s => s[0].toUpperCase() + s.slice(1);
const live = () => Object.values(entries).filter(e => !e.deleted).sort((a, b) => b.t - a.t);
const BOTTLE = { formula: 'Formula', milk: 'Breast milk' };
const SIDE = { left: 'Left', right: 'Right' };
// Bottle amounts are stored as entered (`oz` or `ml`) and converted for display to this phone's unit.
const ML_PER_OZ = 29.5735, UNITS = { oz: 20, ml: 600 }; // unit -> largest sensible bottle
const unit = () => (UNITS[cfg.unit] ? cfg.unit : 'oz');
const toMl = v => (v.ml != null ? Number(v.ml) || 0 : (Number(v.oz) || 0) * ML_PER_OZ);
const fmtMl = ml => (unit() === 'ml' ? `${Math.round(ml)} ml` : `${Math.round(ml / ML_PER_OZ * 100) / 100} oz`);
const entered = v => (v.ml != null ? { n: v.ml, u: 'ml' } : { n: v.oz, u: 'oz' });
function setAmt(v, n, u) { delete v.oz; delete v.ml; v[u === 'ml' ? 'ml' : 'oz'] = n; return v; }
const amtOk = v => { const a = entered(v); return a.n > 0 && a.n <= UNITS[a.u]; };
const other = side => (side === 'left' ? 'right' : 'left');
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// A feed is a list of timed events (a breast side starting, or a bottle). Its time `t` is the first
// event, so "next feed" always counts from the first thing recorded.
// Feeds saved by earlier versions used side/first/t2/bottle fields; read those as events too.
function events(e) {
  if (Array.isArray(e.ev)) return e.ev;
  const ev = [];
  if (SIDE[e.side]) ev.push({ k: e.side, t: e.t });
  if (e.side === 'both' && SIDE[e.first]) ev.push({ k: e.first, t: e.t }, { k: other(e.first), t: e.t2 || e.t });
  const b = BOTTLE[e.bottle] ? e.bottle : e.formula ? 'formula' : '';
  if (b) ev.push({ k: 'bottle', b, oz: Number(e.oz) || 0, t: e.t2 || e.t });
  return ev;
}
function setEv(e, ev) { // store events in time order and drop the fields earlier versions used
  const n = { ...e, ev: [...ev].sort((a, b) => a.t - b.t) };
  n.t = n.ev[0].t;
  for (const k of ['side', 'first', 't2', 'bottle', 'oz', 'formula']) delete n[k];
  return n;
}
const STEP = { pause: 'Paused', resume: 'Resumed' };
const evLabel = v => (STEP[v.k] ? STEP[v.k] : v.k === 'bottle' ? `${BOTTLE[v.b] || 'Bottle'} ${fmtMl(toMl(v))}` : SIDE[v.k] || '?');
function feedText(e) {
  const ev = events(e).filter(v => !STEP[v.k]);
  if (ev.length < 2) return ev.length ? evLabel(ev[0]) : '?';
  return ev.map(v => `${evLabel(v)} ${fmtTime(v.t)}`).join(' → ');
}
const mins = ms => `${Math.round(ms / 60000)} min`;
// Work out a feed's minutes. The feed is a chain of timed parts: left, right and bottle. Each part runs
// until the next part starts, and the last one until the feed's end: the recorded end, or "now" while in
// progress. Bottles saved before bottles were timed (no `seg` flag) are amounts only and end nothing. Time between a pause and
// the next resume (or side) is left out of every figure.
const PART = { ...SIDE, bottle: 'Bottle' };
const isPart = v => !!SIDE[v.k] || (v.k === 'bottle' && !!v.seg);
const lastPartOf = e => events(e).filter(isPart).pop();
function feedCalc(e, now, isOpen) {
  const ev = events(e), end = e.end || (isOpen ? now : null), per = {};
  let cur = null, paused = false, total = 0, pausedMs = 0, curRun = 0, unknown = false;
  ev.forEach((v, i) => {
    if (isPart(v)) { if (v.k !== cur) curRun = 0; cur = v.k; paused = false; }
    else if (v.k === 'pause') paused = true;
    else if (v.k === 'resume') paused = false;
    const stop = ev[i + 1] ? ev[i + 1].t : end;
    if (stop == null) { unknown = !!cur && !paused; return; }
    const dt = Math.max(0, stop - v.t);
    if (paused) pausedMs += dt;
    else { total += dt; if (cur) { per[cur] = (per[cur] || 0) + dt; curRun += dt; } }
  });
  return { per, total: end == null ? null : total, pausedMs, cur, curRun, paused, unknown };
}
function durText(e, now, isOpen) {
  const c = feedCalc(e, now, isOpen), parts = [];
  if (c.total != null) parts.push(`Total ${mins(c.total)}`);
  for (const k in PART) if (c.per[k] != null) parts.push(`${PART[k]} ${mins(c.per[k])}`);
  if (c.pausedMs >= 30000) parts.push(`paused ${mins(c.pausedMs)}`);
  if (!parts.length && !c.unknown) return '';
  return parts.join(' · ') + (isOpen ? (c.paused ? ' · paused now' : ' so far') : '') + (c.unknown ? `${parts.length ? ' · ' : ''}end of feed not recorded` : '');
}
// m:ss clocks for running timers; "56m" / "1h 26m" for the countdown to the next feed
const p2 = n => String(n).padStart(2, '0');
function clock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600);
  return (h ? `${h}:${p2(Math.floor(s / 60) % 60)}` : `${Math.floor(s / 60)}`) + `:${p2(s % 60)}`;
}
function countdown(ms) { const m = Math.ceil(Math.abs(ms) / 60000); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`; }
// what the live timers on the feed card should read right now
function timers(all, now) {
  const open = openFeed(all, now), last = all.find(e => e.type === 'feed' && e.t <= now), t = {};
  if (open) {
    const c = feedCalc(open, now, true);
    t.label = c.paused ? 'Paused' : c.cur ? PART[c.cur] : 'This feed';
    t.side = clock(c.cur ? c.curRun : c.total);
    t.total = c.cur ? `Total ${clock(c.total)}` : '';
    t.paused = c.paused;
  } else if (last) {
    const left = last.t + feedHours() * 3600000 - now;
    t.next = countdown(left); t.late = left <= 0; t.at = fmtTime(now + left);
  }
  return t;
}
function tick() { // update just the timer text every second, without redrawing the buttons
  const t = timers(live(), Date.now());
  for (const [id, v] of [['tSide', t.side], ['tTotal', t.total], ['tNext', t.next]]) {
    const el = document.getElementById(id);
    if (el && v != null && el.textContent !== v) el.textContent = v;
  }
}
const lastSideOf = e => events(e).filter(v => SIDE[v.k]).pop();
function lastSide(all, now) { // most recent breast side across all feeds
  for (const e of all) {
    const v = e.type === 'feed' && e.t <= now && lastSideOf(e);
    if (v) return v;
  }
  return null;
}
// The feed in progress: the latest feed, if not finished and started recently enough.
// Anything recorded while it is open joins it instead of starting a new feed.
const openMs = () => Math.min(2, feedHours()) * 3600000;
function openFeed(all, now) {
  const e = all.find(e => e.type === 'feed' && e.t <= now);
  return e && !e.done && now - e.t < openMs() ? e : null;
}
function addEvent(v) {
  const now = Date.now(), open = openFeed(live(), now);
  v.t = now;
  starting = false;
  if (open) commit(setEv(open, [...events(open), v]));
  else commit({ id: newId(), type: 'feed', t: now, ev: [v], note: '', by: cfg.name || '' });
}
function tapSide(side) {
  const open = openFeed(live(), Date.now());
  if (open && lastPartOf(open)?.k === side) return; // already on this side
  addEvent({ k: side });
}
const dot = id => `<span class="dot" style="background:${COLOR[id]?.hex || '#999'}"></span>`;

/* ---------- render ---------- */
function render() {
  const all = live(), now = Date.now();
  const last24 = all.filter(e => e.t > now - DAY && e.t <= now);
  const cards = Object.keys(TYPES).map(type => {
    const recent = last24.filter(e => e.type === type);
    const last = all.find(e => e.type === type && e.t <= now);
    let sub = last ? `Last: ${ago(last.t)}` : 'Nothing logged yet';
    let extra = '';
    if (type === 'poop' && recent.length) {
      const by = {};
      recent.forEach(e => by[e.color] = (by[e.color] || 0) + 1);
      extra = '<div class="chips">' + COLORS.filter(c => by[c.id]).map(c =>
        `<span class="chip">${dot(c.id)}${esc(c.label)} × ${by[c.id]}</span>`).join('') + '</div>';
    }
    let sides = '', main = `<button class="add" data-add="${type}">+ ${TYPES[type]}</button>`;
    if (type === 'feed') {
      const open = openFeed(all, now), ls = lastSide(all, now), cur = open && lastPartOf(open);
      if (last) {
        const d = durText(last, now, last === open);
        sub = `${open ? 'Feeding now · started' : 'Last feed started'} ${fmtTime(last.t)} · ${ago(last.t)}`
          + `<div class="what">${esc(feedText(last))}</div>${d ? `<div class="dur">${esc(d)}</div>` : ''}`;
      }
      if (ls) sub += `<div class="next">Last side: ${SIDE[ls.k]} <span>started ${fmtTime(ls.t)} · ${ago(ls.t)}</span></div>`;
      const t = timers(all, now);
      main = '<div class="maincol">' + (open
        ? `<button class="add stop" data-feedmain>Finish feed</button>
           <div class="readout"><small>${t.label}</small><b id="tSide">${t.side}</b><small id="tTotal">${t.total}</small></div>
           <button class="pausebtn${t.paused ? ' on' : ''}" data-pause>${t.paused ? 'Resume' : 'Pause'}</button>`
        : starting ? '<button class="add stop" data-feedmain>Cancel</button>'
        : t.next ? `<button class="add${t.late ? ' late' : ''}" data-feedmain aria-label="New feed"><b id="tNext">${t.next}</b><small>${t.late ? 'late · ' : ''}${t.at}</small></button>`
        : '<button class="add" data-feedmain>New feed</button>') + '</div>';
      // the step buttons only appear once a feed is started or in progress
      if (open || starting) sides = (open ? '' : '<div class="prompt">What does this feed start with?</div>')
        + '<div class="sides">' + ['left', 'right'].map(sd =>
          cur && cur.k === sd ? `<button class="done" disabled>${SIDE[sd]} ✓ ${fmtTime(cur.t)}</button>`
          : `<button data-side="${sd}">${cur && SIDE[cur.k] ? 'Switch to' : cur ? 'Back to' : open ? 'Add' : 'Start'} ${SIDE[sd]}</button>`).join('')
        + `<button data-bottle>${open ? 'Add bottle' : 'Bottle'}</button></div>`;
      sides += open ? `<button class="link" data-edit="${esc(open.id)}">Correct this feed</button>`
        : '<button class="link" data-add="feed">Add a missed feed</button>';
    }
    if (type === 'feed' && last && openFeed(all, now)) {
      const due = last.t + feedHours() * 3600000, left = due - now;
      const day = dayKey(due) === dayKey(now) ? '' : fmtDay(due) + ' ';
      extra = left > 0
        ? `<div class="next">Next feed: ${day}${fmtTime(due)} <span>in ${span(left)}</span></div>`
        : `<div class="next due">Next feed: was due ${day}${fmtTime(due)} <span>· ${span(-left)} overdue</span></div>`;
    }
    if (type === 'feed') {
      const oz = {};
      all.forEach(e => e.type === 'feed' && events(e).forEach(v => {
        if (v.k === 'bottle' && v.t > now - DAY && v.t <= now) oz[v.b] = (oz[v.b] || 0) + toMl(v);
      }));
      const chips = Object.keys(BOTTLE).filter(b => oz[b]).map(b =>
        `<span class="chip" style="padding-left:9px">${BOTTLE[b]} ${fmtMl(oz[b])}</span>`);
      if (chips.length) extra += `<div class="chips">${chips.join('')}</div>`;
    }
    return `<div class="card ${type}">
      <h2>${TYPES[type]}</h2>
      ${main}
      <div class="count">${recent.length}<small>in last 24 hours</small></div>
      <div class="sub">${sub}${extra}</div>${sides}
    </div>`;
  });
  $('#cards').innerHTML = cards.join('');

  const openNow = openFeed(all, now);
  const shown = all.filter(e => filter === 'all' || e.type === filter);
  if (!shown.length) {
    $('#history').innerHTML = '<div class="empty">No entries yet. Tap a button above to log one.</div>';
  } else {
    const days = new Map();
    shown.forEach(e => { const k = dayKey(e.t); if (!days.has(k)) days.set(k, []); days.get(k).push(e); });
    $('#history').innerHTML = [...days.values()].map(list => {
      const n = t => list.filter(e => e.type === t).length;
      const totals = Object.keys(TYPES).filter(t => filter === 'all' || filter === t)
        .map(t => `${TYPES[t]} ${n(t)}`).join(' · ');
      return `<div class="day"><div class="day-head"><b>${fmtDay(list[0].t)}</b><span>${totals}</span></div>` +
        list.map(e => {
          let what = TYPES[e.type];
          if (e.type === 'poop') what = `${dot(e.color)}Poop · ${esc(COLOR[e.color]?.label || e.color)}`;
          let dur = '';
          if (e.type === 'feed') {
            what = `Feed · ${esc(feedText(e))}`;
            dur = durText(e, now, e === openNow);
          }
          return `<button class="row" data-edit="${esc(e.id)}">
            <span class="time">${fmtTime(e.t)}</span>
            <span><span class="what">${what}${e.by ? `<span class="by">${esc(e.by)}</span>` : ''}</span>
            ${dur ? `<div class="dur">${esc(dur)}</div>` : ''}${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}</span>
          </button>`;
        }).join('') + '</div>';
    }).join('');
  }

  const s = !cfg.db ? 'Saved on this phone only — set up sync in Settings'
    : syncState === 'ok' ? 'Synced'
    : syncState === 'syncing' ? 'Syncing…'
    : `Not synced yet${dirty.size ? ` (${dirty.size} waiting)` : ''} — will retry`;
  $('#status').textContent = s;
}

/* ---------- entry form ---------- */
const form = $('#entryForm'), dlg = $('#entryDlg');
let editing = null, formType = null;
$('#colorSeg').innerHTML = COLORS.map(c =>
  `<label><input type="radio" name="color" value="${c.id}"><span>${dot(c.id)}${c.label}</span></label>`).join('');

function updateFormVisibility() {
  $('#colorWarn').hidden = !COLOR[form.elements.color.value]?.warn;
}
form.addEventListener('change', updateFormVisibility);

let formEv = []; // working copy of a feed's events while the form is open
function renderEv() {
  $('#evList').innerHTML = formEv.map((v, i) => `<div class="ev" data-i="${i}">
      <div class="ev-head"><b>${STEP[v.k] || (v.k === 'bottle' ? 'Bottle' : SIDE[v.k] + ' side started')}</b><button type="button" data-evdel="${i}">Remove</button></div>
      ${v.k === 'bottle' ? `<div class="ev-bottle"><select data-f="b">${Object.keys(BOTTLE).map(b =>
        `<option value="${b}"${v.b === b ? ' selected' : ''}>${BOTTLE[b]}</option>`).join('')}</select>
        <input type="number" data-f="amt" inputmode="decimal" min="0" step="any" value="${entered(v).n || ''}">
        <select data-f="unit">${Object.keys(UNITS).map(u => `<option${entered(v).u === u ? ' selected' : ''}>${u}</option>`).join('')}</select></div>` : ''}
      <input type="datetime-local" data-f="t" value="${Number.isFinite(v.t) ? toLocalInput(v.t) : ''}">
    </div>`).join('') || '<p class="hint">Nothing added yet. Use the buttons below.</p>';
}
function readEv() {
  document.querySelectorAll('#evList .ev').forEach(row => {
    const v = formEv[row.dataset.i];
    const t = new Date(row.querySelector('[data-f=t]').value).getTime();
    if (toLocalInput(t) !== toLocalInput(v.t)) v.t = t; // keep the exact second unless edited
    if (v.k === 'bottle') { v.b = row.querySelector('[data-f=b]').value; setAmt(v, Number(row.querySelector('[data-f=amt]').value), row.querySelector('[data-f=unit]').value); }
  });
}
form.addEventListener('click', ev => {
  const add = ev.target.closest('[data-evadd]'), del = ev.target.closest('[data-evdel]');
  if (!add && !del) return;
  readEv();
  if (del) formEv.splice(Number(del.dataset.evdel), 1);
  else {
    const prev = formEv.length ? formEv[formEv.length - 1].t : NaN;
    const v = { k: add.dataset.evadd, t: Number.isFinite(prev) ? prev : Date.now() };
    if (v.k === 'bottle') { v.b = load('bt.bottle', 'formula'); v.seg = 1; setAmt(v, 0, unit()); }
    formEv.push(v);
  }
  renderEv();
});

function openEntry(type, entry) {
  editing = entry || null; formType = type;
  form.reset();
  $('#entryTitle').textContent = type === 'feed' ? (entry ? 'Correct feed' : 'Add a missed feed')
    : (entry ? 'Edit ' : 'Log ') + TYPES[type].toLowerCase();
  $('#poopFields').hidden = type !== 'poop';
  $('#feedFields').hidden = type !== 'feed';
  $('#timeWrap').hidden = type === 'feed'; // a feed's time is its first line
  form.elements.time.value = toLocalInput(entry ? entry.t : Date.now());
  form.elements.note.value = entry?.note || '';
  if (type === 'poop') form.elements.color.value = entry?.color || 'yellow';
  if (type === 'feed') {
    formEv = entry ? events(entry).map(v => ({ ...v })) : []; renderEv();
    form.elements.end.value = entry?.end ? toLocalInput(entry.end) : '';
  }
  $('#delBtn').hidden = !entry;
  updateFormVisibility();
  dlg.showModal();
}

form.addEventListener('submit', ev => {
  ev.preventDefault();
  let e = editing ? { ...editing } : { id: newId(), type: formType };
  if (formType === 'feed') {
    readEv();
    if (!formEv.length) return alert('Add at least one side or a bottle.');
    for (const v of formEv) {
      if (!Number.isFinite(v.t)) return alert('Every line needs a day and time.');
      if (v.k === 'bottle' && !amtOk(v)) return alert('Enter how much was in the bottle (up to 20 oz or 600 ml).');
    }
    const ts = formEv.map(v => v.t);
    if (Math.max(...ts) - Math.min(...ts) > 6 * 3600000) return alert('These times are more than 6 hours apart. Check the day on each line.');
    e = setEv(e, formEv);
    if (!editing) e.done = true; // logged after the fact, so nothing more will be added by tapping
    if (form.elements.end.value) {
      const lastStep = Math.max(...ts);
      let end = new Date(form.elements.end.value).getTime();
      if (end < lastStep - 59999) return alert('The feed cannot end before its last step.');
      if (end - e.t > 6 * 3600000) return alert('The end is more than 6 hours after the start. Check the day.');
      if (e.end && toLocalInput(end) === toLocalInput(e.end)) end = e.end; // keep the exact second unless edited
      e.end = Math.max(end, lastStep); e.done = true;
    } else if (e.end) { delete e.end; delete e.done; } // end removed: the feed can be continued
  } else {
    e.t = new Date(form.elements.time.value).getTime();
    if (!Number.isFinite(e.t)) return alert('Please pick a day and time.');
  }
  e.note = form.elements.note.value.trim();
  if (formType === 'poop') e.color = form.elements.color.value;
  if (!editing) e.by = cfg.name || '';
  commit(e);
  dlg.close();
});

/* ---------- quick bottle ---------- */
const bDlg = $('#bottleDlg'), bForm = $('#bottleForm');
function openBottle() {
  bForm.reset();
  bForm.elements.b.value = load('bt.bottle', 'formula');
  bForm.elements.unit.value = unit();
  const open = openFeed(live(), Date.now());
  $('#bottleHint').textContent = open ? `Adds to the feed that started at ${fmtTime(open.t)}.` : 'Starts a new feed now.';
  bDlg.showModal();
}
bForm.addEventListener('submit', ev => {
  ev.preventDefault();
  const b = bForm.elements.b.value, v = setAmt({ k: 'bottle', b, seg: 1 }, Number(bForm.elements.amt.value), bForm.elements.unit.value);
  if (!BOTTLE[b]) return alert('Pick formula or breast milk.');
  if (!amtOk(v)) return alert('Enter how much (up to 20 oz or 600 ml).');
  save('bt.bottle', b);
  cfg.unit = entered(v).u; save('bt.cfg', cfg); // the unit you last used is the one this phone shows
  addEvent(v);
  bDlg.close();
});
$('#bottleCancel').onclick = () => bDlg.close();

$('#cancelBtn').onclick = () => dlg.close();
$('#delBtn').onclick = () => {
  if (!confirm('Delete this entry?')) return;
  commit({ ...editing, deleted: true });
  dlg.close();
};
function commit(e) {
  e.updated = Date.now();
  entries[e.id] = e;
  dirty.add(e.id);
  persist(); render(); push();
}

document.addEventListener('click', ev => {
  const sideBtn = ev.target.closest('[data-side]');
  if (sideBtn) return tapSide(sideBtn.dataset.side);
  if (ev.target.closest('[data-bottle]')) return openBottle();
  if (ev.target.closest('[data-pause]')) {
    const open = openFeed(live(), Date.now());
    if (open) addEvent({ k: feedCalc(open, Date.now(), true).paused ? 'resume' : 'pause' });
    return;
  }
  if (ev.target.closest('[data-feedmain]')) {
    const open = openFeed(live(), Date.now());
    if (open) commit({ ...open, done: true, end: Date.now() }); // Finish feed
    else { starting = !starting; render(); }                    // New feed / Cancel
    return;
  }
  const add = ev.target.closest('[data-add]');
  if (add) return openEntry(add.dataset.add);
  const row = ev.target.closest('[data-edit]');
  if (row) { const e = entries[row.dataset.edit]; if (e) openEntry(e.type, e); return; }
  const tab = ev.target.closest('#tabs button');
  if (tab) {
    filter = tab.dataset.f;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === tab));
    render();
  }
});

/* ---------- sync (Firebase Realtime Database REST API, last-write-wins per entry) ---------- */
const base = () => cfg.db.replace(/\/+$/, '') + '/families/' + encodeURIComponent(cfg.code);
const setSync = s => { syncState = s; render(); };
let pushing = false, stream = null, pullTimer = null;

async function push() {
  if (!cfg.db || pushing || !dirty.size) return;
  pushing = true; setSync('syncing');
  try {
    for (const id of [...dirty]) {
      const sent = entries[id];
      const r = await fetch(`${base()}/entries/${id}.json`, { method: 'PUT', body: JSON.stringify(sent) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (entries[id] === sent) dirty.delete(id); // unchanged while in flight
      persist();
    }
    setSync('ok');
  } catch (err) { console.warn('push failed', err); setSync('error'); }
  pushing = false;
  if (dirty.size && syncState === 'ok') push();
}

async function syncShared() {
  const url = `${base()}/settings.json`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const remote = await r.json();
  if (remote && typeof remote === 'object' && (remote.updated || 0) > (shared.updated || 0)) {
    shared = { feedHours: Number(remote.feedHours), updated: remote.updated };
    sharedDirty = false;
  } else if (sharedDirty) {
    const w = await fetch(url, { method: 'PUT', body: JSON.stringify(shared) });
    if (!w.ok) throw new Error('HTTP ' + w.status);
    sharedDirty = false;
  }
  save('bt.shared', shared); save('bt.sharedDirty', sharedDirty);
}

async function pull() {
  if (!cfg.db) return;
  try {
    const r = await fetch(`${base()}/entries.json`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const remote = (await r.json()) || {};
    await syncShared();
    for (const [id, re] of Object.entries(remote)) {
      if (!re || typeof re !== 'object' || !TYPES[re.type]) continue;
      const le = entries[id];
      if (!le || (re.updated || 0) > (le.updated || 0)) { entries[id] = { ...re, id }; dirty.delete(id); }
    }
    for (const id of Object.keys(entries)) if (!remote[id]) dirty.add(id);
    persist();
    setSync(dirty.size ? 'syncing' : 'ok');
    push();
  } catch (err) { console.warn('pull failed', err); setSync('error'); }
}
const schedulePull = () => { clearTimeout(pullTimer); pullTimer = setTimeout(pull, 300); };

function connect() {
  if (stream) { stream.close(); stream = null; }
  if (!cfg.db) return render();
  pull();
  try { // live updates from the other phone
    stream = new EventSource(`${base()}/entries.json`);
    stream.addEventListener('put', schedulePull);
    stream.addEventListener('patch', schedulePull);
  } catch {}
}
window.addEventListener('online', pull);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); pull(); } });
setInterval(render, 60000);
setInterval(tick, 1000);
setInterval(() => { if (!document.hidden && syncState === 'error') pull(); }, 30000);

/* ---------- settings + invite link ---------- */
const sForm = $('#settingsForm'), sDlg = $('#settingsDlg');
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 24);
const inviteLink = () => location.origin + location.pathname + '#join=' + btoa(JSON.stringify({ db: cfg.db, code: cfg.code }));
function showSettings() {
  sForm.elements.name.value = cfg.name;
  sForm.elements.unit.value = unit();
  sForm.elements.feedHours.value = feedHours();
  sForm.elements.db.value = cfg.db;
  $('#inviteBtn').hidden = !cfg.db;
  $('#syncHint').textContent = cfg.db
    ? 'Sync is on. Send the invite link to the other phone — opening it connects that phone to the same log.'
    : 'Leave empty to keep the log on this phone only. See the README for the 5-minute sync setup.';
  sDlg.showModal();
}
$('#openSettings').onclick = showSettings;
$('#settingsCancel').onclick = () => sDlg.close();
sForm.addEventListener('submit', ev => {
  ev.preventDefault();
  const db = sForm.elements.db.value.trim();
  if (db && !/^https:\/\/[^/]+/.test(db)) return alert('The database URL should start with https://');
  const changed = db !== cfg.db;
  const fh = Number(sForm.elements.feedHours.value);
  if (!(fh >= 0.5 && fh <= 12)) return alert('Hours between feeds should be between 0.5 and 12.');
  const fhChanged = fh !== feedHours();
  if (fhChanged) {
    shared = { feedHours: fh, updated: Date.now() }; sharedDirty = true;
    save('bt.shared', shared); save('bt.sharedDirty', true);
  }
  cfg.name = sForm.elements.name.value.trim();
  cfg.unit = sForm.elements.unit.value;
  cfg.db = db;
  if (db && !cfg.code) cfg.code = newCode();
  save('bt.cfg', cfg);
  sDlg.close();
  if (changed) { syncState = 'idle'; connect(); } else { render(); if (fhChanged) pull(); }
});
$('#inviteBtn').onclick = async () => {
  const url = inviteLink();
  try {
    if (navigator.share) await navigator.share({ title: 'Baby Log', url });
    else { await navigator.clipboard.writeText(url); alert('Invite link copied. Send it to the other phone.'); }
  } catch { prompt('Copy this link and send it to the other phone:', url); }
};
function handleJoin() {
  const m = location.hash.match(/^#join=(.+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const j = JSON.parse(atob(m[1]));
    if (!/^https:\/\//.test(j.db) || !j.code) throw 0;
    if (cfg.db === j.db && cfg.code === j.code) return;
    if (!confirm('Connect this phone to the shared baby log?')) return;
    cfg.db = j.db; cfg.code = String(j.code);
    save('bt.cfg', cfg);
  } catch { alert('That invite link is not valid.'); }
}

handleJoin();
render();
connect();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
